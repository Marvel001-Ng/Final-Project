<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourEdo - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="auth-header">
  <a href="index.html" class="home-link">← Back to Home</a>
</header>

  <div class="auth-container">
    <div class="auth-box">
      <h1 class="logo">TourEdo</h1>
      <h2>Create Account</h2>
      <p>Join TourEdo and start exploring Edo.</p>

<form class="auth-form">
    <div id="form-message"></div> <!-- message area -->
        
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>
        
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
        
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required>
        
    <div class="checkbox">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the Terms & Conditions and Privacy Policy</label>
    </div>
    
    <button type="submit" class="signup-btn">Create Account</button>
</form>

      <div class="divider">or</div>
      <button class="google-btn">Continue with Google</button>

      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>

  <script>
  const form = document.querySelector(".auth-form");
  const messageBox = document.getElementById("form-message");

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const name = document.getElementById("fullname").value;
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if(password !== confirm) {
      messageBox.textContent = "❌ Passwords do not match!";
      messageBox.className = "error";
      messageBox.style.display = "block";
    } else {
      messageBox.textContent = "✅ Welcome " + name + "! Your account has been created.";
      messageBox.className = "success";
      messageBox.style.display = "block";
    }
  });
</script>


</body>
</html>
