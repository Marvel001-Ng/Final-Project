<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/forgot.css">
</head>
<body>
    <header>
        <div class="form-section">
            <a href="../index.html" class="back-home">← Back to Home</a>
            <!-- logo and the headed  dic container -->
            <div class="logo">
                <img src="../asset/images/TourEdo Design.jpg" alt="">
                <h2 id="Tour">Tour<span id="Edo">Edo</span></h2>
            </div>
            <!-- header -->
            <div class="forgot-header">
                <h1>Forgot Password?</h1>
                <p>No Worries! Enter Your Email and we`ll send <br>
                you a reset link</p>
            </div>
            <!-- form container -->
             <form class="forgot-form">
                <!-- forgot password form  -->
                <div class="forgot-group">
                    <label for="Email">Email Address</label>

                    <input type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
                </div>
                <!-- send reset link on the form container -->
                 <button type="submit"
                 class="forgot-link">Send Reset Link
                </button>
                <p class="or">Or</p>
                <p class="back">
                    ←
                    <a href="login.html" id="Login">Back to Login</a>
                </p>
             </form>
        </div>
    </header>
    
</body>
</html>
