<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header>
        <div class="form-section">
            <a href="../index.html" class="back-home">← Back to Home</a>
            <!-- logo and the header div container -->
            <div class="logo">
                <img src="../asset/images/TourEdo Design.jpg" alt="logo">
                <h2 id="Tour">Tour<span id="Edo">Edo</span></h2>
            </div>
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login in to continue your Journey with TourEdo</p>
            </div>
            <!-- form container -->
           <form class="login-form">
            <div class="form-group">
                <label for="Email">Email Address</label>
                <input type="email"
                name="email"
                id="email"
                placeholder="Enter your email"
                required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>

                    <input type="password"
                    id="password"
                    name="password"
                    placeholder="Creat a password"
                    required>
            </div>
            <!-- remember me and forgot password div container -->
             <div class="login-option">
                <div class="remember">
                    <input type="checkbox"
                    id="checkbox"
                    name="checkbox"
                    required>

                    <label for="options">
                        Remember me
                    </label>
                </div>
                <a href="forgot.html" class="forgot-password">Forgot Password</a>
             </div>
             <!-- login button inside the form container -->
              <button type="submit"
              class="login-button">Login</button>
              <p class="signup-link">
                Don`t Have An Account
              <a href="register.html" id="signup">Sign up</a></p>
           </form>
        </div>
    </header>
</body>
</html>
