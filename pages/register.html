<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Register - TourEdo</title>
    <link rel='stylesheet' href="../css/register.css">
</head>
<body>
    <header>
        <div class="form-section">
            <a href="../index.html" class="back-home">← Back to Home</a>
            <!-- logo and the header div container -->
            <div class="logo">
                <img src="../asset/images/TourEdo Design.jpg" alt="">
                <h2 id="Tour">Tour<span id="Edo">Edo</span></h2>
            </div>
            <div class="signup-header">
                <h1>Creat Your Account</h1>
                <p>Join TourEdo and start exploring Edo</p>
            </div>
            <!-- form container  -->
             <form id="register-form" class="register-form">
                <!-- full name input  -->
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="Enter your full name"
                    required>
                </div>
                <!-- email input -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
                </div>
                <!-- password input -->
                <div class="form-group">
                    <label for="password">Creat a Password</label>

                    <input type="password"
                    id="password"
                    name="password"
                    placeholder="Creat a password"
                    required>
                </div>
                <!-- confirm password input -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm your password"
                    required>
                </div>

                <!-- terms and condition div container input -->
                 <div class="terms-group">
                    <input type="checkbox"
                    id="terms"
                    name="terms"
                    required>

                    <label for="terms">
                        I Agree to the Terms and Conditions
                    </label>
                 </div>
                 <!-- signup button inside the form container -->
                  <button type="submit"
                   class="signup-button">
                   Creat Account
                </button>

                <!-- signup message for the authenication -->
                 <p id="register-message"></p>

                <p class="login-link">
                    Already Have an account?
                    <a href="login.html" id="login">Login</a>
                </p>
             </form>
        </div>
    </header>
    <script src="../js/register.js"></script>
</body>
</html>
