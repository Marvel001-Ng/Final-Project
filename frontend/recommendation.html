<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TourEdo - AI Recommendations</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <a class="logo" href="index.html">TourEdo</a>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="trip-planner.html">Trip Planner</a></li>
        <li><a href="attraction-details.html">Attractions</a></li>
        <li><a href="hotel.html">Hotels</a></li>
        <li><a href="event.html">Events</a></li>
      </ul>
      <div class="auth-buttons">
        <a class="login" href="login.html">Login</a>
        <a class="signup" href="signup.html">Sign Up</a>
      </div>
    </nav>
  </header>

  <main class="details-container">
    <section class="planner-panel" style="max-width: 760px; margin: 0 auto;">
      <div class="panel-heading">
        <span class="step-number">AI</span>
        <div>
          <span class="eyebrow">Smart itinerary</span>
          <h2>Tell us your travel preferences</h2>
        </div>
      </div>

      <form id="recommendation-form" class="auth-form">
        <div class="planner-fields-row">
          <div class="form-group">
            <label for="budget">Budget (₦)</label>
            <input id="budget" type="number" value="80000" required />
          </div>
          <div class="form-group">
            <label for="days">Travel days</label>
            <input id="days" type="number" value="2" min="1" required />
          </div>
        </div>

        <div class="form-group">
          <label for="interest">Interest</label>
          <select id="interest" class="form-dropdown">
            <option value="culture">Culture</option>
            <option value="nature">Nature</option>
            <option value="adventure">Adventure</option>
          </select>
        </div>

        <div class="form-group">
          <label for="location">Preferred area</label>
          <input id="location" type="text" placeholder="Benin City" />
        </div>

        <button type="submit" class="signup-btn">Generate recommendation</button>
      </form>

      <div id="recommendation-result" class="planner-result hidden" style="margin-top: 1.5rem;"></div>
    </section>
  </main>

  <script>
    const apiBase = 'http://localhost:7000';
    const form = document.getElementById('recommendation-form');
    const result = document.getElementById('recommendation-result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        budget: Number(document.getElementById('budget').value || 0),
        days: Number(document.getElementById('days').value || 1),
        interest: document.getElementById('interest').value,
        location: document.getElementById('location').value.trim()
      };

      try {
        const token = localStorage.getItem('authToken');
        const response = await fetch(`${apiBase}/api/recommendations`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: token ? `Bearer ${token}` : 'Bearer demo-token'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Recommendation request failed.');
        }

        const suggestions = data.suggestions || {};
        const hotelName = suggestions.hotel ? suggestions.hotel.name : 'No hotel match';
        const attractions = (suggestions.attractions || []).map(item => `<li>${item.name} — ₦${item.price}</li>`).join('');
        const estBudget = suggestions.estimatedBudget ? `₦${suggestions.estimatedBudget}` : 'Not available';

        result.classList.remove('hidden');
        result.innerHTML = `
          <div class="result-heading">
            <span class="step-number">AI</span>
            <div>
              <span class="eyebrow">Suggested plan</span>
              <h2>Your smart recommendation</h2>
            </div>
          </div>
          <div class="result-summary">
            <div><span>Budget</span><strong>₦${payload.budget}</strong></div>
            <div><span>Days</span><strong>${payload.days}</strong></div>
            <div><span>Interest</span><strong>${payload.interest}</strong></div>
          </div>
          <p><strong>Best hotel:</strong> ${hotelName}</p>
          <p><strong>Suggested attractions:</strong></p>
          <ul>${attractions || '<li>No exact match found in this set.</li>'}</ul>
          <p><strong>Estimated total:</strong> ${estBudget}</p>
        `;
      } catch (error) {
        result.classList.remove('hidden');
        result.innerHTML = `<p class="result-note">${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
