<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourEdo - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="auth-header">
    <a href="index.html" class="home-link">← Back to Home</a>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <h1 class="logo">TourEdo</h1>
      <h2>Welcome Back</h2>
      <p>Login to continue your journey with TourEdo.</p>

      <!-- Clean container for handling status/error feedback messages -->
      <div id="form-message" class="hidden-message"></div>

      <!-- Added ID attribute to pinpoint form handling explicitly -->
      <form class="auth-form" id="login-form">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required autocomplete="username">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">

        <div class="checkbox">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="signup-btn" id="submit-btn">Log In</button>
      </form>

      <div class="divider">or</div>
      <button class="google-btn" type="button">Continue with Google</button>

      <p class="switch"><a href="forgot.html">Forgot Password?</a></p>
      <p class="switch">Don’t have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <!-- JavaScript separated from HTML structure and updated for JWT operations -->
  <script>
    document.getElementById("login-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const messageBox = document.getElementById("form-message");
  const submitBtn = document.getElementById("submit-btn");

  messageBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Processing...";

  try {
    const targetApiUrl = "http://localhost:7000/api/auth/login";

    const response = await fetch(targetApiUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    if (!response.ok) {
      if (response.status === 401) throw new Error("Invalid email or password.");
      throw new Error("Server error. Please try again later.");
    }

    const data = await response.json();
    const token = data.token;
    const role = data.role;

    localStorage.setItem("authToken", token);
    localStorage.setItem("userRole", role);
    localStorage.setItem("userName", data.user?.name || email.split("@")[0]);

    messageBox.textContent = "✅ Login successful! Redirecting...";
    messageBox.style.backgroundColor = "#e6f4ea";
    messageBox.style.color = "#137333";
    messageBox.style.display = "block";

    setTimeout(() => {
      if (role === "admin") {
        window.location.href = "admin-dashboard.html";
      } else if (role === "guide") {
        window.location.href = "guide-dashboard.html";
      } else {
        window.location.href = "dashboard.html";
      }
    }, 1500);

  } catch (error) {
    messageBox.textContent = `❌ ${error.message}`;
    messageBox.style.backgroundColor = "#fce8e6";
    messageBox.style.color = "#c5221f";
    messageBox.style.display = "block";

    submitBtn.disabled = false;
    submitBtn.textContent = "Log In";
  }
});

  </script>
</body>
</html>
